name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true
        type: string

# The top level grants read access and nothing else. The job that publishes the release declares
# the write permission it needs for itself, so neither the job running the test suite nor the job
# holding the signing key can change repository state.
permissions:
  contents: read

# Runs on the GitHub-hosted Ubuntu image, named by version rather than as `ubuntu-latest`.
# The label moves to a new Ubuntu release when GitHub promotes one, which would change the
# image every job builds on without a line of this repository changing, and a release that
# fails for a reason unrelated to its own commit is the thing this pipeline exists to avoid.
# Pinning costs nothing today: `ubuntu-latest` resolves to this image.
#
# An Alpine container was tried and rejected: GitHub provides no Alpine runner, and Android's
# build tools—aapt2, d8, apksigner—are glibc-linked binaries, so running the build under musl
# depends on a compatibility shim that is not worth the risk to a release pipeline.
#
# The jobs are shaped so the clock is paid once. Building and testing do not depend on each
# other—only publishing depends on the test result—so they run at the same time, and the
# release is gated on both: a build that succeeds while the tests fail publishes nothing, and a
# release is never published from a build that failed. Signing stays in the build job, where
# apksigner is installed; the publish job that follows needs neither a JDK nor an Android SDK,
# because downloading an artifact and calling the release action uses neither.
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # compileSdk 37 resolves to the minor-versioned package platforms;android-37.0,
      # which a default runner image does not include. Install it rather than assume.
      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The patcher engine tests self-check the ZIP alignment math and the binary-XML
      # attribute editor. A test that needs one of the source APKs reports itself as skipped when
      # the file is absent, never as a pass and never as a failure, so a clean runner runs what
      # it can; the skipped count in the report shows how much of the suite did not run here.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  # Builds and signs. Nothing here publishes, and nothing here waits on the test job: the two
  # run at the same time and only the release job below waits for both.
  build:
    name: Build & Sign
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve tag name
        id: vars
        env:
          # The tag arrives as a value in the environment. Interpolating it into the script body
          # instead lets a tag name carrying shell syntax run as part of this step, and this
          # step runs in the same job as the ones holding the signing secrets.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG: ${{ steps.vars.outputs.tag }}
          # Outside build-out, which is uploaded whole: a certificate dump is not a release asset.
          CERTS: ${{ runner.temp }}/certs.txt
          # Read from the environment rather than substituted into the script text, so a secret
          # is never parsed as shell.
          EXPECTED: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p build-out

          # Discover apksigner rather than assuming a build-tools revision.
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using $APKSIGNER"

          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::no release APK produced"
            exit 1
          fi
          echo "Signing $APK"

          SIGNED_APK="build-out/sleepy-${TAG}.apk"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          "$APKSIGNER" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED_APK" \
            "$APK"
          rm -f release.jks

          # Verify rather than assume, and fail the release if the signature is bad.
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK" | tee "$CERTS"

          # A valid signature is not the same as our signature. An APK signed by any other key
          # verifies, so without this the workflow would publish it. The expected digest lives in
          # a repository secret rather than here, because a fingerprint written into the file it
          # checks proves nothing.
          #
          # An unset secret is reported as unchecked rather than as a pass: the release still
          # publishes, and the warning is on the run. Setting the secret turns the check on.
          if [ -z "$EXPECTED" ]; then
            echo "::warning::RELEASE_CERT_SHA256 is not set, so the release signer was not checked against the expected identity. Set it to the SHA-256 of the release certificate."
          else
            ACTUAL=$(grep -oE 'SHA-256 digest: [0-9a-f]+' "$CERTS" | head -1 | awk '{print $3}')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::the release is signed by $ACTUAL, not by the expected $EXPECTED"
              exit 1
            fi
            echo "Signed by the expected key: $ACTUAL"
          fi

          sha256sum "$SIGNED_APK" | tee build-out/sha256.txt

      # Only the signed artifact crosses to the publishing job: it is what gets released, and the
      # hash beside it is what the publishing job checks it against. A step that failed above
      # means this never runs, so a build that could not be signed uploads nothing to publish.
      - name: Upload the signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-apk
          path: build-out
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [test, build]
    runs-on: ubuntu-24.04
    # The only job that writes. It runs no build tooling and holds no signing key.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-apk
          path: build-out

      # The bytes were hashed where they were signed. Re-checking them here keeps the release
      # tied to that hash rather than to a file that merely arrived under the same name.
      - name: Verify the signed APK against its published hash
        run: sha256sum -c build-out/sha256.txt

      - name: Resolve tag name
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: python3 .github/scripts/gen_release_notes.py "$TAG" > RELEASE_CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          body_path: RELEASE_CHANGELOG.md
          files: |
            build-out/sleepy-*.apk
            build-out/sha256.txt
            sources.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
