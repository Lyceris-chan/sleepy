org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
kotlin.code.style=official
# Configuration cache on. Anything read while configuring has to go through a tracked provider —
# a bare `File.readText` is invisible to it and the entry built from it is reused even after the
# file changes. `app/build.gradle.kts` reads CHANGELOG.md for the version and does so through
# `providers.fileContents` for exactly that reason: an untracked read there would have shipped
# the previous version out of a cache that looked like it was working.
org.gradle.configuration-cache=true
