[versions]
agp             = "9.4.1"
kotlin          = "2.4.20"
compose-bom     = "2026.09.00"
activity-compose = "1.13.0"
navigation      = "2.10.2"
lifecycle       = "2.11.0"
coroutines      = "1.11.0"
adaptive        = "1.3.0"
smali           = "3.0.10"
apksig          = "9.4.1"
okhttp          = "5.5.0"

[libraries]
# Compose — managed by BOM
compose-bom             = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui              = { group = "androidx.compose.ui", name = "ui" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons  = { group = "androidx.compose.material", name = "material-icons-extended" }

# AndroidX — NOT in BOM, version explicitly
activity-compose        = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
navigation-compose      = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
lifecycle-viewmodel     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
adaptive                = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }
coroutines-android      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# APK tooling — from google() repo
smali                   = { group = "com.android.tools.smali", name = "smali", version.ref = "smali" }
baksmali                = { group = "com.android.tools.smali", name = "smali-baksmali", version.ref = "smali" }
apksig                  = { group = "com.android.tools.build", name = "apksig", version.ref = "apksig" }

# Network
okhttp                  = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 provides Kotlin compilation itself; org.jetbrains.kotlin.android must not be applied.
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
